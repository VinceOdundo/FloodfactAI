name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      DEMO_MODE: "true"
      CRON_SECRET: ci-placeholder-secret-not-for-prod-0000
      REPORT_HMAC_SECRET: ci-placeholder-secret-not-for-prod-0001
      ADMIN_REVEAL_AUDIT_SALT: ci-placeholder-secret-not-for-prod-0002
      AT_INBOUND_SECRET: ci-placeholder-secret-not-for-prod-0003
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Build (demo mode — no live Supabase project needed)
        run: npm run build

  migrations:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Install pgvector
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-16-pgvector

      - name: Apply local-dev shim, all migrations, and seed data
        env:
          PGPASSWORD: postgres
          DB_URL: postgresql://postgres:postgres@localhost:5432/postgres
        run: |
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f scripts/dev/local-supabase-shim.sql
          for f in supabase/migrations/*.sql; do
            echo "Applying $f"
            psql "$DB_URL" -v ON_ERROR_STOP=1 -f "$f"
          done
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f supabase/seed.sql
